[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gaf-ppo-trading"
version = "1.0.0"
description = "GAF-PPO Financial Vision Trading System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "yfinance>=0.2.28",
    "pyts>=0.12.0",
    "gymnasium>=0.29.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "plotly>=5.18.0",
    "tqdm>=4.66.0",
    "tensorboard>=2.15.0",
    "scikit-learn>=1.3.0",
    "alpha_vantage>=2.3.1",
    "python-dotenv",
    "matplotlib",
    "pillow",
]

[project.scripts]
train = "src.training.train:train"
dashboard = "scripts.run_dashboard:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
